<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T999 Trial Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0d10;
      color: #ffffff;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .subtitle {
      color: #9da4ad;
      margin-bottom: 24px;
    }

    .card {
      background: #15191f;
      border: 1px solid #2a3038;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      color: #b9c0c8;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 9px;
      border: 1px solid #353c45;
      background: #0f1216;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6f7b89;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #ffffff;
      color: #111111;
    }

    .secondary {
      background: #2a3038;
      color: #ffffff;
    }

    .danger {
      background: #512727;
      color: #ffffff;
    }

    .status {
      margin-top: 14px;
      min-height: 20px;
      color: #b9c0c8;
      white-space: pre-wrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #2a3038;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #9da4ad;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background: #253128;
    }

    .badge.off {
      background: #432727;
    }

    .small-btn {
      padding: 7px 10px;
      font-size: 12px;
      margin-right: 5px;
      margin-bottom: 5px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #808892;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .wrap {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>T999 Trial Admin</h1>

    <div class="subtitle">
      ระบบสร้างและควบคุมสิทธิ์ T999 Web Trial
      — ใช้งานเต็มระบบ จำกัดเฉพาะช่วงเวลาที่ Admin กำหนด
    </div>

    <div class="card">

      <h2>สร้างสิทธิ์ Trial</h2>

      <div class="grid">

        <div>
          <label>รหัส Trial</label>
          <input
            id="trialCode"
            type="text"
            placeholder="เช่น T999-ABC123"
          />
        </div>

        <div>
          <label>ชื่อลูกค้า / ร้าน</label>
          <input
            id="customerName"
            type="text"
            placeholder="เช่น ร้านสมชาย"
          />
        </div>

        <div>
          <label>วันเวลาเริ่มใช้งาน</label>
          <input
            id="startsAt"
            type="datetime-local"
          />
        </div>

        <div>
          <label>วันเวลาหมดอายุ</label>
          <input
            id="expiresAt"
            type="datetime-local"
          />
        </div>

      </div>

      <div class="actions">

        <button
          class="secondary"
          onclick="setSevenDays()"
        >
          ตั้ง 7 วันอัตโนมัติ
        </button>

        <button
          class="primary"
          onclick="createTrial()"
        >
          สร้างสิทธิ์ Trial
        </button>

      </div>

      <div
        id="formStatus"
        class="status"
      ></div>

    </div>


    <div class="card">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          margin-bottom:15px;
        "
      >

        <h2 style="margin:0;">
          รายการ Trial
        </h2>

        <button
          class="secondary"
          onclick="loadTrials()"
        >
          รีเฟรช
        </button>

      </div>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>รหัส</th>
              <th>ลูกค้า / ร้าน</th>
              <th>Workspace</th>
              <th>เริ่ม</th>
              <th>หมดอายุ</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>

          <tbody id="trialRows">

            <tr>
              <td colspan="7" class="empty">
                กำลังโหลด...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script>

    function localInputValue(date) {
      const offset =
        date.getTimezoneOffset() * 60000;

      return new Date(
        date.getTime() - offset
      )
      .toISOString()
      .slice(0, 16);
    }


    function toThailandISOString(value) {
      if (!value) {
        return '';
      }

      return new Date(
        value + ':00+07:00'
      ).toISOString();
    }


    function setSevenDays() {
      const now =
        new Date();

      const end =
        new Date(
          now.getTime() +
          7 * 24 * 60 * 60 * 1000
        );

      document.getElementById(
        'startsAt'
      ).value =
        localInputValue(now);

      document.getElementById(
        'expiresAt'
      ).value =
        localInputValue(end);
    }


    async function createTrial() {
      const status =
        document.getElementById(
          'formStatus'
        );

      const trialCode =
        document.getElementById(
          'trialCode'
        )
        .value
        .trim()
        .toUpperCase();

      const customerName =
        document.getElementById(
          'customerName'
        )
        .value
        .trim();

      const startsAt =
        document.getElementById(
          'startsAt'
        )
        .value;

      const expiresAt =
        document.getElementById(
          'expiresAt'
        )
        .value;

      if (
        !trialCode ||
        !startsAt ||
        !expiresAt
      ) {
        status.textContent =
          'กรุณากรอกรหัส Trial และวันเวลาให้ครบ';

        return;
      }

      status.textContent =
        'กำลังสร้างสิทธิ์ Trial...';

      try {
        const response =
          await fetch(
            '/api/trials',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  trialCode,
                  customerName,
                  startsAt:
                    toThailandISOString(
                      startsAt
                    ),
                  expiresAt:
                    toThailandISOString(
                      expiresAt
                    )
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            'สร้าง Trial ไม่สำเร็จ'
          );
        }

        status.textContent =
          'สร้าง Trial สำเร็จ\n' +
          'รหัส: ' +
          data.trial.trialCode +
          '\nWorkspace: ' +
          data.trial.workspaceId;

        document.getElementById(
          'trialCode'
        ).value = '';

        document.getElementById(
          'customerName'
        ).value = '';

        await loadTrials();
      }
      catch (error) {
        status.textContent =
          error.message;
      }
    }


    async function loadTrials() {
      const rows =
        document.getElementById(
          'trialRows'
        );

      rows.innerHTML =
        '<tr>' +
        '<td colspan="7" class="empty">' +
        'กำลังโหลด...' +
        '</td>' +
        '</tr>';

      try {
        const response =
          await fetch(
            '/api/trials'
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            'โหลดรายการไม่สำเร็จ'
          );
        }

        if (
          !data.trials ||
          !data.trials.length
        ) {
          rows.innerHTML =
            '<tr>' +
            '<td colspan="7" class="empty">' +
            'ยังไม่มี Trial' +
            '</td>' +
            '</tr>';

          return;
        }

        rows.innerHTML =
          data.trials
          .map(renderTrialRow)
          .join('');
      }
      catch (error) {
        rows.innerHTML =
          '<tr>' +
          '<td colspan="7" class="empty">' +
          error.message +
          '</td>' +
          '</tr>';
      }
    }


    function renderTrialRow(trial) {
      const active =
        trial.status === 'ACTIVE';

      return `
        <tr>

          <td>
            <strong>
              ${escapeHtml(
                trial.trialCode
              )}
            </strong>
          </td>

          <td>
            ${escapeHtml(
              trial.customerName || ''
            )}
          </td>

          <td>
            ${escapeHtml(
              trial.workspaceId || ''
            )}
          </td>

          <td>
            ${formatDate(
              trial.startsAt
            )}
          </td>

          <td>
            ${formatDate(
              trial.expiresAt
            )}
          </td>

          <td>
            <span
              class="badge ${
                active
                  ? ''
                  : 'off'
              }"
            >
              ${
                active
                  ? 'ใช้งาน'
                  : 'ปิด'
              }
            </span>
          </td>

          <td>

            <button
              class="small-btn secondary"
              onclick="
                extendTrial(
                  ${trial.id}
                )
              "
            >
              +7 วัน
            </button>

            <button
              class="
                small-btn
                ${
                  active
                    ? 'danger'
                    : 'secondary'
                }
              "
              onclick="
                toggleTrial(
                  ${trial.id},
                  '${active
                    ? 'DISABLED'
                    : 'ACTIVE'
                  }'
                )
              "
            >

              ${
                active
                  ? 'ปิดใช้งาน'
                  : 'เปิดใช้งาน'
              }

            </button>

          </td>

        </tr>
      `;
    }


    async function extendTrial(id) {
      if (
        !confirm(
          'เพิ่มเวลา Trial อีก 7 วัน?'
        )
      ) {
        return;
      }

      try {
        const response =
          await fetch(
            '/api/trials',
            {
              method: 'PATCH',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  id,
                  action:
                    'EXTEND_7_DAYS'
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            'เพิ่มเวลาไม่สำเร็จ'
          );
        }

        await loadTrials();
      }
      catch (error) {
        alert(
          error.message
        );
      }
    }


    async function toggleTrial(
      id,
      status
    ) {
      try {
        const response =
          await fetch(
            '/api/trials',
            {
              method: 'PATCH',

              headers: {
                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify({
                  id,
                  action:
                    'SET_STATUS',
                  status
                })
            }
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.message ||
            'เปลี่ยนสถานะไม่สำเร็จ'
          );
        }

        await loadTrials();
      }
      catch (error) {
        alert(
          error.message
        );
      }
    }


    function formatDate(value) {
      if (!value) {
        return '';
      }

      return new Date(
        value
      )
      .toLocaleString(
        'th-TH',
        {
          timeZone:
            'Asia/Bangkok'
        }
      );
    }


    function escapeHtml(value) {
      return String(
        value || ''
      )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );
    }


    setSevenDays();

    loadTrials();

  </script>

</body>
</html>
